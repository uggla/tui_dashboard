[workspace]
members = ["sncf"]

[package]
name = "tui-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.29.0"
tui-big-text = "0.7.1"
notify-rust = "4.11.7"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "zstd"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
dotenvy = "0.15.7"
urlencoding = "2.1.3"
toml = "0.9.5"
jiff = "0.2.15"
sncf = { path = "sncf" }
anyhow = "1.0.99"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "time"] }
