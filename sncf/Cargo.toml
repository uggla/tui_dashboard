[package]
name = "sncf"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
urlencoding = "2.1.3"
jiff = "0.2.15"
thiserror = "2.0.16"
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["full"] }
